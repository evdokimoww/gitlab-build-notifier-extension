<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>GitLab Build Notifier</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef0f3;
        --bg-grid: rgba(38, 45, 56, 0.045);
        --surface: #ffffff;
        --surface-soft: #f5f6f8;
        --surface-inset: #e9ebef;
        --text: #17191d;
        --text-soft: #5e6470;
        --text-faint: #858b96;
        --border: #d9dce2;
        --border-strong: #c5c9d1;
        --accent: #fc6d26;
        --accent-dark: #c94d0b;
        --focus: #3f73d8;
        --ok: #16805c;
        --ok-soft: #e5f5ee;
        --shadow: 0 16px 34px rgba(28, 33, 41, 0.13);
        --sans: "Avenir Next", "Segoe UI Variable", "Segoe UI", sans-serif;
        --mono: "SFMono-Regular", "Cascadia Code", "Roboto Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 344px;
        min-width: 344px;
        margin: 0;
        color: var(--text);
        background-color: var(--bg);
        background-image:
          linear-gradient(var(--bg-grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
        background-size: 24px 24px;
        font-family: var(--sans);
      }

      a {
        outline: none;
      }

      a:focus-visible {
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 24%, transparent);
      }

      .popup-shell {
        margin: 10px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .popup-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-soft);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .brand-mark {
        width: 27px;
        height: 27px;
        position: relative;
        flex: 0 0 auto;
        border-radius: 8px;
        background: linear-gradient(145deg, #ff8a49, var(--accent));
        box-shadow: 0 5px 12px rgba(252, 109, 38, 0.25);
      }

      .brand-mark::before,
      .brand-mark::after {
        content: "";
        position: absolute;
        background: #fff;
      }

      .brand-mark::before {
        width: 10px;
        height: 3px;
        left: 8px;
        top: 12px;
        border-radius: 999px;
      }

      .brand-mark::after {
        width: 5px;
        height: 5px;
        left: 10px;
        top: 10px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: var(--accent);
      }

      .brand-name {
        display: block;
        font-size: 12px;
        font-weight: 750;
        letter-spacing: -0.015em;
      }

      .brand-product {
        display: block;
        margin-top: 1px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 7px;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .live-state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--ok);
        font-family: var(--mono);
        font-size: 8px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .live-state::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 3px var(--ok-soft);
        animation: pulse 1.8s ease-in-out infinite;
      }

      .popup-body {
        padding: 15px 14px 14px;
      }

      .eyebrow {
        margin-bottom: 5px;
        color: var(--accent-dark);
        font-family: var(--mono);
        font-size: 8px;
        font-weight: 750;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 720;
        letter-spacing: -0.04em;
        line-height: 1.08;
      }

      .status-card {
        position: relative;
        margin-top: 13px;
        padding: 11px 12px 11px 31px;
        overflow: hidden;
        color: var(--text-soft);
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface-soft);
        font-size: 10.5px;
        line-height: 1.45;
      }

      .status-card::before {
        content: "";
        width: 7px;
        height: 7px;
        position: absolute;
        top: 15px;
        left: 13px;
        border: 2px solid var(--ok);
        border-radius: 50%;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        margin-top: 13px;
      }

      .action {
        min-height: 39px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 13px;
        color: var(--text);
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: var(--surface);
        font-size: 11px;
        font-weight: 750;
        text-decoration: none;
        transition:
          transform 0.15s ease,
          border-color 0.15s ease,
          background 0.15s ease,
          box-shadow 0.15s ease;
      }

      .action:hover {
        border-color: var(--text-faint);
        background: var(--surface-soft);
        transform: translateY(-1px);
      }

      .action--primary {
        color: #fff;
        border-color: var(--accent-dark);
        background: linear-gradient(180deg, #ff7f3f, var(--accent));
        box-shadow: 0 5px 13px rgba(252, 109, 38, 0.22);
      }

      .action--primary:hover {
        border-color: var(--accent-dark);
        background: linear-gradient(180deg, #ff8a50, #f36018);
        box-shadow: 0 7px 17px rgba(252, 109, 38, 0.3);
      }

      .action-arrow {
        font-family: var(--mono);
        font-size: 13px;
      }

      .popup-foot {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 12px;
        color: var(--text-faint);
        font-family: var(--mono);
        font-size: 8px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }

      .popup-foot::before {
        content: "";
        width: 18px;
        height: 1px;
        background: var(--border-strong);
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 3px var(--ok-soft);
        }
        50% {
          box-shadow: 0 0 0 5px transparent;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111318;
          --bg-grid: rgba(255, 255, 255, 0.025);
          --surface: #1a1d23;
          --surface-soft: #171a20;
          --surface-inset: #252930;
          --text: #eceef2;
          --text-soft: #a6acb7;
          --text-faint: #757d89;
          --border: #2d323b;
          --border-strong: #414751;
          --accent: #ff7a38;
          --accent-dark: #ff945f;
          --focus: #75a2ff;
          --ok: #4ac696;
          --ok-soft: #192c26;
          --shadow: 0 18px 42px rgba(0, 0, 0, 0.3);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>
            <span class="brand-name">Build Notifier</span>
            <span class="brand-product">GitLab CI control</span>
          </span>
        </div>
        <span class="live-state">Active</span>
      </header>

      <div class="popup-body">
        <div class="eyebrow">Pipeline observer</div>
        <h1>Сборки под контролем</h1>

        <div id="line" class="status-card">
          Опрос открытых вкладок MR / pipeline по таймеру.
        </div>

        <div class="actions">
          <a id="promote" href="#" class="action action--primary">
            Promote MR
            <span class="action-arrow" aria-hidden="true">→</span>
          </a>
          <a id="opts" href="#" class="action">Настройки</a>
        </div>

        <div class="popup-foot">Работает локально в браузере</div>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
